<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adriano Paulo Barbearia</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif}
    body{background:#000;color:#fff;padding:16px;min-height:100vh}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;animation:fadeInDown 0.6s ease}
    h1{font-size:22px;font-weight:700;color:#D4AF37;text-transform:uppercase;letter-spacing:2px}
    .menu-btn{background:none;border:none;font-size:28px;cursor:pointer;color:#D4AF37;transition:transform 0.3s}
    .menu-btn:hover{transform:scale(1.1)}
    .dashboard{background:linear-gradient(135deg,#1a1a1a,#0a0a0a);border:1px solid #333;border-radius:16px;padding:20px;margin-bottom:32px;animation:fadeInUp 0.6s ease 0.1s both}
    .dashboard h2{font-size:16px;color:#D4AF37;margin-bottom:16px;text-transform:uppercase;letter-spacing:1px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .stat{background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.3);border-radius:12px;padding:16px;text-align:center;transition:all 0.3s}
    .stat:hover{transform:translateY(-3px);border-color:#D4AF37}
    .stat-value{font-size:28px;font-weight:700;color:#D4AF37}
    .stat-label{font-size:11px;color:#fff;margin-top:6px;text-transform:uppercase;letter-spacing:1px}
    .services{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:32px}
    .service-card{background:linear-gradient(135deg,#1a1a1a,#0a0a0a);border:1px solid #333;border-radius:16px;padding:20px;text-align:center;cursor:pointer;transition:all 0.4s;position:relative;overflow:hidden}
    .service-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,rgba(212,175,55,0.1),transparent);opacity:0;transition:opacity 0.4s}
    .service-card:hover::before{opacity:1}
    .service-card:hover{transform:translateY(-5px);border-color:#D4AF37;box-shadow:0 10px 30px rgba(212,175,55,0.2)}
    .service-card.selected{background:linear-gradient(135deg,#D4AF37,#B8941F);border-color:#D4AF37}
    .service-card.selected h3,.service-card.selected p{color:#000}
    .service-card h3{font-size:15px;color:#fff;margin-bottom:6px;font-weight:600;transition:color 0.3s}
    .service-card p{font-size:13px;color:#D4AF37;transition:color 0.3s}
    #bookingSection{background:linear-gradient(135deg,#1a1a1a,#0a0a0a);border:1px solid #333;border-radius:16px;padding:24px;margin-bottom:32px;animation:slideIn 0.5s ease}
    #bookingSection h2{font-size:20px;color:#D4AF37;margin-bottom:20px;text-transform:uppercase;letter-spacing:1px}
    .back-btn{background:none;border:none;color:#D4AF37;font-size:14px;cursor:pointer;margin-bottom:16px;transition:color 0.3s}
    .back-btn:hover{color:#fff}
    .form-group{margin-bottom:20px}
    label{display:block;font-size:12px;color:#D4AF37;margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
    input,textarea{width:100%;padding:14px;background:#0a0a0a;border:1px solid #333;border-radius:10px;font-size:14px;color:#fff;transition:all 0.3s}
    input:focus,textarea:focus{outline:none;border-color:#D4AF37;box-shadow:0 0 15px rgba(212,175,55,0.3)}
    input::placeholder,textarea::placeholder{color:#666}
    .btn{width:100%;padding:16px;background:linear-gradient(135deg,#D4AF37,#B8941F);color:#000;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;transition:all 0.3s;text-transform:uppercase;letter-spacing:1px}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(212,175,55,0.4)}
    .btn:active{transform:translateY(0)}
    .btn:disabled{background:#555;cursor:not-allowed;transform:none;box-shadow:none}
    #adminPanel{background:linear-gradient(135deg,#1a1a1a,#0a0a0a);border:1px solid #333;border-radius:16px;padding:24px;animation:slideIn 0.5s ease}
    #adminPanel h2{font-size:20px;color:#D4AF37;margin-bottom:20px;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:12px}
    .admin-item{border-bottom:1px solid #333;padding:16px 0;transition:all 0.3s}
    .admin-item:hover{background:rgba(212,175,55,0.05);padding-left:12px;border-radius:8px}
    .admin-item:last-child{border-bottom:none}
    .admin-item h3{font-size:15px;color:#fff;margin-bottom:6px}
    .admin-item p{font-size:12px;color:#888}
    .status{font-size:10px;padding:6px 12px;border-radius:6px;display:inline-block;margin-top:8px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
    .status-pendente{background:rgba(255,193,7,0.2);color:#FFC107;border:1px solid rgba(255,193,7,0.3)}
    .status-confirmado{background:rgba(76,175,80,0.2);color:#4CAF50;border:1px solid rgba(76,175,80,0.3)}
    .status-concluido{background:rgba(33,150,243,0.2);color:#2196F3;border:1px solid rgba(33,150,243,0.3)}
    .status-cancelado{background:rgba(244,67,54,0.2);color:#F44336;border:1px solid rgba(244,67,54,0.3)}
    .logout-btn{background:linear-gradient(135deg,#F44336,#D32F2F);color:#fff;border:none;padding:12px 24px;border-radius:10px;font-size:12px;cursor:pointer;margin-top:20px;transition:all 0.3s;text-transform:uppercase;letter-spacing:1px;font-weight:600}
    .logout-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(244,67,54,0.4)}
    .refresh-btn{background:linear-gradient(135deg,#D4AF37,#B8941F);color:#000;border:none;padding:10px 20px;border-radius:8px;font-size:11px;cursor:pointer;transition:all 0.3s;text-transform:uppercase;letter-spacing:1px;font-weight:600}
    .refresh-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,175,55,0.4)}
    .hidden{display:none}
    @keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
  </style>
</head>
<body>
  <header>
    <h1>Adriano Paulo</h1>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
  </header>

  <div id="dashboardSection">
    <div class="dashboard">
      <h2>Resumo</h2>
      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="totalBookings">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="todayBookings">0</div>
          <div class="stat-label">Hoje</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="pendingBookings">0</div>
          <div class="stat-label">Pendentes</div>
        </div>
      </div>
    </div>
  </div>

  <div id="servicesSection">
    <div class="services" id="servicesList"></div>
  </div>

  <div id="bookingSection" class="hidden">
    <button class="back-btn" onclick="backToServices()">← Voltar</button>
    <h2 id="selectedServiceTitle"></h2>
    <div class="form-group">
      <label>Seu nome</label>
      <input type="text" id="clientName" placeholder="Digite seu nome">
    </div>
    <div class="form-group">
      <label>Data</label>
      <input type="date" id="bookingDate">
    </div>
    <div class="form-group">
      <label>Horário</label>
      <input type="time" id="bookingTime" min="09:00" max="19:00">
    </div>
    <div class="form-group">
      <label>Observações</label>
      <textarea id="bookingNotes" rows="2" placeholder="Ex: barba cheia, cabelo na régua..."></textarea>
    </div>
    <button class="btn" id="sendBtn" onclick="sendToWhatsApp()">Enviar para WhatsApp</button>
  </div>

  <div id="adminPanel" class="hidden">
    <h2>Agendamentos <button class="refresh-btn" onclick="loadAdmin()">Atualizar</button></h2>
    <div id="adminList"></div>
    <button class="logout-btn" onclick="logout()">Sair</button>
  </div>

  <script>
    // URL do seu Google Apps Script (https://script.google.com/macros/s/AKfycbxSKS_TFJJAv79hi41klApJkGsd6XMMy2Ty8DRvMMhEcYSeH6sn4gCgEq-2QL_25UnbDw/exec)
    const SCRIPT_URL = 'https://script.google.com/macros/s/SEU_CODIGO_AQUI/exec';
    
    const SERVICES=[
      {id:1,name:'Corte de Cabelo',price:50},
      {id:2,name:'Barba',price:30},
      {id:3,name:'Cabelo + Barba',price:70},
      {id:4,name:'Pezinho/Sombrancelha',price:15},
      {id:5,name:'Corte Infantil',price:40},
      {id:6,name:'Platinado',price:150},
      {id:7,name:'Social',price:60},
      {id:8,name:'Navalhado',price:60}
    ];

    let selectedService=null;
    const PHONE='5511930962041';
    let allBookings=[];

    function init(){
      const servicesList=document.getElementById('servicesList');
      servicesList.innerHTML='';
      SERVICES.forEach((service,index)=>{
        const card=document.createElement('div');
        card.className='service-card';
        card.style.animation='fadeInUp 0.5s ease '+(0.2+index*0.1)+'s both';
        card.innerHTML='<h3>'+service.name+'</h3><p>R$ '+service.price+'</p>';
        card.onclick=function(){selectService(service);};
        servicesList.appendChild(card);
      });
      const today=new Date().toISOString().split('T')[0];
      document.getElementById('bookingDate').min=today;
      loadBookings();
    }

    function loadBookings(){
      fetch(SCRIPT_URL+'?action=list')
        .then(r=>r.json())
        .then(data=>{
          if(data.success){
            allBookings=data.data||[];
            updateDashboard();
          }
        })
        .catch(err=>console.log('Erro ao carregar:',err));
    }

    function updateDashboard(){
      const today=new Date().toISOString().split('T')[0];
      const todayCount=allBookings.filter(b=>b.date===today).length;
      const pendingCount=allBookings.filter(b=>b.status==='Pendente').length;
      document.getElementById('totalBookings').textContent=allBookings.length;
      document.getElementById('todayBookings').textContent=todayCount;
      document.getElementById('pendingBookings').textContent=pendingCount;
    }

    function selectService(service){
      selectedService=service;
      document.querySelectorAll('.service-card').forEach(c=>c.classList.remove('selected'));
      event.currentTarget.classList.add('selected');
      document.getElementById('servicesSection').classList.add('hidden');
      document.getElementById('bookingSection').classList.remove('hidden');
      document.getElementById('selectedServiceTitle').textContent=service.name+' - R$ '+service.price;
    }

    function backToServices(){
      selectedService=null;
      document.getElementById('servicesSection').classList.remove('hidden');
      document.getElementById('bookingSection').classList.add('hidden');
      document.getElementById('clientName').value='';
      document.getElementById('bookingDate').value='';
      document.getElementById('bookingTime').value='';
      document.getElementById('bookingNotes').value='';
      document.querySelectorAll('.service-card').forEach(c=>c.classList.remove('selected'));
    }

    function sendToWhatsApp(){
      const name=document.getElementById('clientName').value.trim();
      const date=document.getElementById('bookingDate').value;
      const time=document.getElementById('bookingTime').value;
      const notes=document.getElementById('bookingNotes').value.trim();
      if(!name||!date||!time||!selectedService){alert('Preencha todos os campos!');return;}
      
      const btn=document.getElementById('sendBtn');
      btn.disabled=true;
      btn.textContent='Enviando...';
      
      const id=Date.now().toString().slice(-6);
      const booking={
        action:'create',
        id:id,
        client:name,
        service:selectedService.name,
        price:selectedService.price,
        date:date,
        time:time,
        notes:notes,
        status:'Pendente',
        signal:0
      };
      
      fetch(SCRIPT_URL,{
        method:'POST',
        mode:'no-cors',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:new URLSearchParams(booking)
      })
      .then(()=>{
        const dateFormatted=date.split('-').reverse().join('/');
        const msg1='*NOVO AGENDAMENTO*%0A%0A*Cliente:* '+name+'%0A*Serviço:* '+selectedService.name+'%0A*Valor:* R$ '+selectedService.price+'%0A*Data:* '+dateFormatted+'%0A*Horário:* '+time+(notes?'%0A*Obs:* '+notes:'');
        const msg2='Olá '+name+'! Seu agendamento para '+selectedService.name+' dia '+dateFormatted+' às '+time+' foi recebido. Em breve confirmaremos!';
        
        window.open('https://wa.me/'+PHONE+'?text='+msg1,'_blank');
        setTimeout(()=>{window.open('https://wa.me/'+PHONE+'?text='+msg2,'_blank');},500);
        
        alert('Agendamento enviado!');
        loadBookings();
        backToServices();
      })
      .catch(err=>{
        alert('Erro ao enviar. Tente novamente.');
        console.error(err);
      })
      .finally(()=>{
        btn.disabled=false;
        btn.textContent='Enviar para WhatsApp';
      });
    }

    function toggleMenu(){
      const adminPanel=document.getElementById('adminPanel');
      const dashboardSection=document.getElementById('dashboardSection');
      const servicesSection=document.getElementById('servicesSection');
      const bookingSection=document.getElementById('bookingSection');
      
      if(adminPanel.classList.contains('hidden')){
        const user=prompt('Usuário:');
        const pass=prompt('Senha:');
        if(user==='Adri@n08850'&&pass==='ADR5529'){
          adminPanel.classList.remove('hidden');
          dashboardSection.classList.add('hidden');
          servicesSection.classList.add('hidden');
          bookingSection.classList.add('hidden');
          loadAdmin();
        }else{alert('Dados incorretos!');}
      }else{
        adminPanel.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        servicesSection.classList.remove('hidden');
      }
    }

    function loadAdmin(){
      const list=document.getElementById('adminList');
      list.innerHTML='<p style="color:#D4AF37;text-align:center;padding:20px;">Carregando...</p>';
      
      fetch(SCRIPT_URL+'?action=list')
        .then(r=>r.json())
        .then(data=>{
          if(data.success){
            const bookings=data.data||[];
            list.innerHTML='';
            if(bookings.length===0){
              list.innerHTML='<p style="color:#666;text-align:center;padding:20px;">Nenhum agendamento</p>';
              return;
            }
            bookings.forEach((b,index)=>{
              const item=document.createElement('div');
              item.className='admin-item';
              item.style.animation='fadeInUp 0.4s ease '+(0.1+index*0.1)+'s both';
              const statusClass='status-'+(b.status||'Pendente').toLowerCase();
              item.innerHTML='<h3>'+(b.client||'N/A')+' - '+(b.service||'N/A')+'</h3><p>'+(b.date?b.date.split('-').reverse().join('/'):'N/A')+' às '+(b.time||'N/A')+' | R$ '+(b.price||0)+'</p><span class="status '+statusClass+'">'+(b.status||'Pendente')+'</span>';
              list.appendChild(item);
            });
          }else{
            list.innerHTML='<p style="color:#F44336;text-align:center;padding:20px;">Erro ao carregar</p>';
          }
        })
        .catch(()=>{
          list.innerHTML='<p style="color:#F44336;text-align:center;padding:20px;">Erro de conexão</p>';
        });
    }

    function logout(){
      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('servicesSection').classList.remove('hidden');
      loadBookings();
    }

    init();
  </script>
</body>
</html>
